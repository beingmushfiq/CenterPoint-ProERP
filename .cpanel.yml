---
# ==============================================================================
# DevCenterPoint ProERP — cPanel Git Automated Deployment Specification
# ==============================================================================
# Target Server Layout:
#   Backend:  $HOME/projects/proerp/backend
#   Frontend: $HOME/projects/proerp/public
#   Scripts:  $HOME/scripts
#   Logs:     $HOME/logs
# ==============================================================================

deployment:
  tasks:
    # 1. Ensure target deployment and logging directories exist
    - /bin/mkdir -p $HOME/projects/proerp/backend
    - /bin/mkdir -p $HOME/projects/proerp/public
    - /bin/mkdir -p $HOME/scripts
    - /bin/mkdir -p $HOME/logs

    # 2. Deploy Laravel Backend (application source, config, database, routes)
    - /bin/cp -Rf backend/. $HOME/projects/proerp/backend/

    # 3. Deploy Frontend Web Root (SPA bundle, index.php, .htaccess, static assets)
    - /bin/cp -Rf public_html/. $HOME/projects/proerp/public/
    - /bin/cp -f public_html/.htaccess $HOME/projects/proerp/public/.htaccess
    - /bin/cp -f public_html/index.php $HOME/projects/proerp/public/index.php
    - /bin/cp -f public_html/index.html $HOME/projects/proerp/public/index.html

    # 4. Deploy deployment scripts and ensure execution permissions
    - /bin/cp -Rf scripts/. $HOME/scripts/
    - /bin/chmod +x $HOME/scripts/*.sh 2>/dev/null || true
    - /bin/chmod +x scripts/*.sh 2>/dev/null || true
    - /bin/chmod +x deploy.sh 2>/dev/null || true

    # 5. Execute production deployment pipeline (composer, migrations, caches, queue restart)
    - REPO_DIR="$PWD" /bin/bash scripts/deploy-cpanel.sh


