---
# ==============================================================================
# DevCenterPoint ProERP — cPanel Git Automated Deployment Specification
# ==============================================================================
# Target Server Layout:
#   Backend:  /home/devcente/projects/proerp/backend
#   Frontend: /home/devcente/projects/proerp/public
#   Scripts:  /home/devcente/scripts
#   Logs:     /home/devcente/logs
# ==============================================================================

deployment:
  tasks:
    # 1. Ensure target deployment and logging directories exist
    - /bin/mkdir -p /home/devcente/projects/proerp/backend
    - /bin/mkdir -p /home/devcente/projects/proerp/public
    - /bin/mkdir -p /home/devcente/scripts
    - /bin/mkdir -p /home/devcente/logs

    # 2. Deploy Laravel Backend (application source, config, database, routes)
    - /bin/cp -Rf backend/. /home/devcente/projects/proerp/backend/

    # 3. Deploy Frontend Web Root (SPA bundle, index.php, .htaccess, static assets)
    - /bin/cp -Rf public_html/. /home/devcente/projects/proerp/public/

    # 4. Deploy deployment scripts and ensure execution permissions
    - /bin/cp -Rf scripts/. /home/devcente/scripts/
    - /bin/chmod +x /home/devcente/scripts/*.sh 2>/dev/null || true

    # 5. Execute production deployment pipeline (composer, migrations, caches, queue restart)
    - /bin/bash /home/devcente/scripts/deploy-cpanel.sh
