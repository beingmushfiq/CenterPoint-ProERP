<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!--
      viewport-fit=cover keeps the shell under the notch on iOS so the sidebar
      reaches the screen edge. `maximum-scale` / `user-scalable=no` are
      deliberately ABSENT: suppressing pinch-zoom fails WCAG 2.2 AA (1.4.4
      Resize Text) and this product is read on a factory floor where magnifying
      a batch code is a legitimate need. iOS zoom-on-focus is prevented the
      correct way instead — 16px inputs below 640px in base.css.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      Title and description are platform-level, not tenant-level. Slice Mart is
      tenant #1, not the product (PROJECT_CONTEXT.md §1). Tenant name and logo
      are injected at runtime from tenant settings; nothing here may name one.
    -->
    <title>Manufacturing Operations Platform</title>
    <meta
      name="description"
      content="Multi-tenant manufacturing, inventory, sales, workforce and delivery operations platform."
    />
    <meta name="application-name" content="Operations Platform" />

    <!-- PWA & mobile web app -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      Two theme-colors so the browser chrome matches the resolved theme instead
      of fighting it. media queries here track the OS; the pre-paint script
      below overrides the tag when the user has an explicit stored preference.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#2563eb" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Manufacturing Operations Platform" />
    <meta
      property="og:description"
      content="Production, inventory, quality, sales and workforce operations in one system."
    />

    <!-- ═══════════════════════════════════════════════════════════════════════
         PRE-PAINT PREFERENCE RESOLVER                        UI_SYSTEM.md §3.1
         ─────────────────────────────────────────────────────────────────────
         Runs before the stylesheet is applied, so the correct token set is in
         effect for the FIRST paint. A flash of the wrong theme is a bug, not a
         cosmetic nitpick — on a factory floor at night it is genuinely
         unpleasant.

         Blocking and inline on purpose. It is ~40 lines of synchronous work
         against localStorage; deferring it is what causes the flash.

         Three preferences, three mirrors, all resolved identically:
           ui.theme          light | dark | system   → .dark class
           ui.density        comfortable | compact   → [data-density]
           ui.reduced-motion true | false | system   → [data-reduced-motion]

         The store is the source of truth once React mounts; these keys are its
         mirror. Reading a stale mirror is harmless — the app reconciles on
         hydration. Writing from here is not, so this script never writes.
         ═══════════════════════════════════════════════════════════════════════ -->
    <script>
      (function () {
        var el = document.documentElement;

        function read(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            /* Safari private mode throws on localStorage access. Fall through
               to system defaults rather than failing to boot. */
            return null;
          }
        }

        function media(query) {
          try {
            return window.matchMedia(query).matches;
          } catch (e) {
            return false;
          }
        }

        /* ── Theme ─────────────────────────────────────────────────────────── */
        var theme = read('ui.theme') || read('theme') || 'light';
        var dark = theme === 'dark';
        if (dark) {
          el.classList.add('dark');
          el.setAttribute('data-theme', 'dark');
        } else {
          el.classList.remove('dark');
          el.setAttribute('data-theme', 'light');
        }

        /* Keep the browser chrome in step */
        var tags = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < tags.length; i++) tags[i].removeAttribute('media');
        var chrome = document.createElement('meta');
        chrome.setAttribute('name', 'theme-color');
        chrome.setAttribute('content', dark ? '#020617' : '#f8fafc');
        document.head.appendChild(chrome);

        /* ── Density ───────────────────────────────────────────────────────── */
        var density = read('ui.density');
        if (density === 'compact') el.setAttribute('data-density', 'compact');

        /* ── Reduced motion ────────────────────────────────────────────────── */
        var motion = read('ui.reduced-motion') || 'system';
        var reduce =
          motion === 'true' ||
          (motion === 'system' && media('(prefers-reduced-motion: reduce)'));
        if (reduce) el.setAttribute('data-reduced-motion', 'true');

        /* Marks the boot loader's first real milestone (§7.5 tier 1). The rail
           advances on milestones, never on a timer. */
        el.setAttribute('data-boot', 'parsed');
      })();
    </script>

    <!-- ═══════════════════════════════════════════════════════════════════════
         BOOT LOADER — TIER 1                                 UI_SYSTEM.md §7.5
         ─────────────────────────────────────────────────────────────────────
         Inline SVG + inline CSS, under 4KB, zero dependencies. It must render
         in the first frame — before the stylesheet, before React, before the
         font. So it cannot use a design token, a utility class or an import;
         every value here is literal by necessity. This is the one file in the
         codebase where that is allowed, and the reason is that it has to work
         when nothing else has loaded yet.

         The mark draws itself over ~900ms, then holds with a 2s breathing
         pulse. The hairline rail beneath advances on real milestones only.
         Escalation is honest: silent to 8s, "Still loading…" at 8s, a retry
         affordance at 20s. It never spins forever.
         ═══════════════════════════════════════════════════════════════════════ -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 700;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #f8fafc;
        color: #35456e;
        font:
          500 13px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .dark #boot {
        background: #020617;
        color: #93a6d2;
      }

      /* The mark: three stacked bars being filled, then a check. Reads as
         "throughput" — the thing this product actually measures. Geometric,
         drawn from the same visual language as the empty-state illustrations. */
      #boot-mark {
        width: 52px;
        height: 52px;
        overflow: visible;
      }
      #boot-mark path,
      #boot-mark rect {
        fill: none;
        stroke: #2563eb;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dark #boot-mark path,
      .dark #boot-mark rect {
        stroke: #60a5fa;
      }
      #boot-mark .b {
        stroke-dasharray: 96;
        stroke-dashoffset: 96;
        animation: boot-draw 0.62s cubic-bezier(0.05, 0.7, 0.1, 1) forwards;
      }
      #boot-mark .b2 {
        animation-delay: 0.1s;
      }
      #boot-mark .b3 {
        animation-delay: 0.2s;
      }
      #boot-mark .tick {
        stroke: #f59e0b;
        stroke-dasharray: 26;
        stroke-dashoffset: 26;
        animation: boot-draw 0.42s cubic-bezier(0.05, 0.7, 0.1, 1) 0.46s forwards;
      }
      #boot-glyph {
        animation: boot-breathe 2s ease-in-out 0.95s infinite;
      }
      @keyframes boot-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      /* Real progress. Width is set from JS on milestones — there is no
         keyframe driving it, because fake progress is forbidden (§7.4). */
      #boot-rail {
        position: relative;
        width: 132px;
        height: 2px;
        border-radius: 9999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      .dark #boot-rail {
        background: rgb(255 255 255 / 0.1);
      }
      #boot-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 12%;
        border-radius: inherit;
        background: #2563eb;
        transition: width 0.38s cubic-bezier(0.3, 0, 0, 1);
      }
      .dark #boot-fill {
        background: #60a5fa;
      }

      #boot-msg {
        min-height: 18px;
        max-width: 30ch;
        text-align: center;
        opacity: 0;
        transition: opacity 0.24s linear;
      }
      #boot-msg[data-show='1'] {
        opacity: 1;
      }
      #boot-retry {
        margin-top: 10px;
        padding: 7px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        color: #263352;
        font: inherit;
        cursor: pointer;
      }
      .dark #boot-retry {
        border-color: rgb(255 255 255 / 0.16);
        background: #1a2438;
        color: #f1f5f9;
      }
      #boot-ref {
        margin-top: 8px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 11px;
        opacity: 0.62;
      }

      /* Removed from the DOM after this completes — not left hidden. */
      #boot[data-exit='1'] {
        opacity: 0;
        transition: opacity 0.24s cubic-bezier(0.3, 0, 0.8, 0.15);
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-mark .b,
        #boot-mark .tick,
        #boot-glyph {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 1;
        }
        #boot-fill,
        #boot[data-exit='1'] {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <div id="boot" role="status" aria-live="polite" aria-label="Loading application">
      <svg id="boot-mark" viewBox="0 0 40 40" aria-hidden="true">
        <g id="boot-glyph">
          <rect class="b" x="4" y="7" width="24" height="7" rx="2.5" />
          <rect class="b b2" x="4" y="17" width="32" height="7" rx="2.5" />
          <rect class="b b3" x="4" y="27" width="18" height="7" rx="2.5" />
          <path class="tick" d="M25 30.5l3.6 3.6L36 26" />
        </g>
      </svg>
      <div id="boot-rail"><div id="boot-fill"></div></div>
      <div id="boot-msg"></div>
    </div>

    <script>
      (function () {
        var boot = document.getElementById('boot');
        if (!boot) return;

        var fill = document.getElementById('boot-fill');
        var msg = document.getElementById('boot-msg');
        var started = Date.now();
        var timers = [];

        /* Real milestones, real weights. The shell reports these as it reaches
           them; nothing here advances on its own. */
        var STEPS = { parsed: 12, scripts: 30, auth: 55, tenant: 75, route: 100 };

        function show(text) {
          msg.textContent = text;
          msg.setAttribute('data-show', '1');
        }

        window.__boot = {
          /* Called by the shell: window.__boot.step('auth') */
          step: function (name) {
            var pct = STEPS[name];
            if (pct && fill) fill.style.width = pct + '%';
            document.documentElement.setAttribute('data-boot', name);
          },

          /* Called once the first route has painted. Fades, then removes. */
          done: function () {
            for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
            if (fill) fill.style.width = '100%';
            boot.setAttribute('data-exit', '1');
            setTimeout(function () {
              if (boot.parentNode) boot.parentNode.removeChild(boot);
              delete window.__boot;
            }, 260);
          },

          /* Called by the shell when boot genuinely fails (auth transport down,
             tenant unresolvable). Surfaces the correlation id so support has
             something to search for — never a stack trace. */
          fail: function (message, correlationId) {
            for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
            show(message || 'We could not start the application.');
            escalate(correlationId);
          },
        };

        function escalate(correlationId) {
          if (document.getElementById('boot-retry')) return;
          var btn = document.createElement('button');
          btn.id = 'boot-retry';
          btn.type = 'button';
          btn.textContent = 'Retry';
          btn.addEventListener('click', function () {
            location.reload();
          });
          boot.appendChild(btn);
          if (correlationId) {
            var ref = document.createElement('div');
            ref.id = 'boot-ref';
            ref.textContent = 'Reference ' + correlationId;
            boot.appendChild(ref);
          }
        }

        /* Honest escalation. Silence, then an acknowledgement, then an exit. */
        timers.push(
          setTimeout(function () {
            show('Still loading…');
          }, 8000)
        );
        timers.push(
          setTimeout(function () {
            show('This is taking longer than expected.');
            escalate(null);
          }, 20000)
        );

        /* Safety net: if the module bundle itself never executes, the loader is
           the only thing on screen and would sit silently. Mark the milestone
           the browser can prove. */
        window.addEventListener('load', function () {
          if (window.__boot && Date.now() - started < 20000) window.__boot.step('scripts');
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
